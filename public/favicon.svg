<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa8ff"/>
      <stop offset="1" stop-color="#0066e6"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#002a66" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/><rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>
  <g transform="translate(0.0 0.0) scale(1.0)"><g>
    <!-- divider tabs peeking out of the right edge -->
    <rect x="690" y="300" width="96" height="92" rx="24" fill="#ff453a"/>
    <rect x="690" y="410" width="96" height="92" rx="24" fill="#ff9f0a"/>
    <rect x="690" y="520" width="96" height="92" rx="24" fill="#30d158"/>
    <!-- page -->
    <g filter="url(#shadow)">
      <rect x="232" y="196" width="512" height="640" rx="64" fill="url(#page)"/>
    </g>
    <!-- binder rings -->
    <g fill="#c7ccd6">
      <rect x="196" y="300" width="96" height="40" rx="20"/>
      <rect x="196" y="492" width="96" height="40" rx="20"/>
      <rect x="196" y="684" width="96" height="40" rx="20"/>
    </g>
    <g fill="#8e939e">
      <circle cx="272" cy="320" r="12"/>
      <circle cx="272" cy="512" r="12"/>
      <circle cx="272" cy="704" r="12"/>
    </g>
    <!-- heading + lines -->
    <rect x="336" y="292" width="200" height="36" rx="18" fill="#007aff"/>
    <g fill="#dde2ea">
      <rect x="336" y="384" width="328" height="24" rx="12"/>
      <rect x="336" y="448" width="328" height="24" rx="12"/>
      <rect x="336" y="512" width="248" height="24" rx="12"/>
    </g>
    <!-- heart (health) -->
    <path d="M512 752c-10 0-86-52-86-110 0-30 22-52 50-52 16 0 30 8 36 20 6-12 20-20 36-20 28 0 50 22 50 52 0 58-76 110-86 110z" fill="#ff375f"/>
  </g></g>
</svg>
